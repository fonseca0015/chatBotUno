<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente UNO ERP</title>
<style>
:root {
    --bg-color: #202123;
    --user-bg: #3a76f0;
    --bot-bg: #2a2b2f;
    --input-bg: #343541;
    --text-color: #e5e5e5;
    --placeholder-color: #999;
}

body {
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
}

header {
    background-color: #444654;
    padding: 16px;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 600;
    color: #fff;
}

#chat-body {
    flex-grow: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.input-area {
    display: flex;
    padding: 12px;
    background-color: var(--input-bg);
    border-top: 1px solid #555;
}

#pergunta {
    flex-grow: 1;
    padding: 10px 16px;
    border-radius: 20px;
    border: none;
    outline: none;
    font-size: 1rem;
    background-color: #40414f;
    color: var(--text-color);
}

#pergunta::placeholder {
    color: var(--placeholder-color);
}

button {
    margin-left: 10px;
    padding: 10px 20px;
    border-radius: 20px;
    border: none;
    background-color: var(--user-bg);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

button:hover {
    background-color: #2e5ac5;
}

.message-container {
    display: flex;
    flex-direction: column;
}

.user-message {
    align-items: flex-end;
}

.bot-message {
    align-items: flex-start;
}

.message {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.5;
    word-wrap: break-word;
}

.user-message .message {
    background-color: var(--user-bg);
    color: white;
    border-bottom-right-radius: 4px;
}

.bot-message .message {
    background-color: var(--bot-bg);
    color: var(--text-color);
    border-bottom-left-radius: 4px;
    white-space: pre-wrap;
}

/* Animação de digitando */
.typing {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 24px;
}

.dot {
    width: 6px;
    height: 6px;
    background-color: #888;
    border-radius: 50%;
    animation: bounce 1s infinite;
}

.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-8px); }
}
</style>
</head>
<body>

<header>Assistente UNO ERP</header>
<div id="chat-body"></div>

<div class="input-area">
    <input type="text" id="pergunta" placeholder="Digite sua pergunta...">
    <button id="send-button" onclick="fazerBusca()">Enviar</button>
</div>

<script>
const perguntaInput = document.getElementById('pergunta');
const sendButton = document.getElementById('send-button');
const chatBody = document.getElementById('chat-body');

perguntaInput.addEventListener('keyup', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        fazerBusca();
    }
});

function createMessageContainer(sender) {
    const container = document.createElement('div');
    container.className = `message-container ${sender}-message`;
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message';
    container.appendChild(messageDiv);
    chatBody.appendChild(container);
    chatBody.scrollTop = chatBody.scrollHeight;
    return container;
}

function appendMessage(text, container) {
    const messageDiv = container.querySelector('.message');
    messageDiv.innerHTML = text; // <-- agora recebe HTML
    chatBody.scrollTop = chatBody.scrollHeight;
}


function showTyping(container) {
    const typingDiv = document.createElement('div');
    typingDiv.className = 'typing';
    for (let i = 0; i < 3; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        typingDiv.appendChild(dot);
    }
    container.appendChild(typingDiv);
    chatBody.scrollTop = chatBody.scrollHeight;
    return typingDiv;
}

async function fazerBusca() {
    const pergunta = perguntaInput.value.trim();
    if (!pergunta) return;

    const n8nWebhookUrl = 'https://unoerpai2.app.n8n.cloud/webhook/c7683d30-5ffb-448b-a9cb-2dac0ac443bb';

    const userContainer = createMessageContainer('user');
    appendMessage(pergunta, userContainer);
    perguntaInput.value = '';
    sendButton.disabled = true;

    const botContainer = createMessageContainer('bot');
    const typingDiv = showTyping(botContainer);

    try {
        const response = await fetch(n8nWebhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pergunta })
        });

        if (!response.ok) throw new Error(response.statusText);
        const data = await response.json();

        typingDiv.remove();

        const output = data.resposta || "Não foi possível obter uma resposta.";
        appendMessage(output, botContainer);

        if (data.fontes && data.fontes.length > 0) {
            const fontesDiv = document.createElement('div');
            fontesDiv.className = 'sources-area';
            const ul = document.createElement('ul');
            data.fontes.forEach(fonte => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = fonte;
                a.textContent = fonte;
                a.target = '_blank';
                li.appendChild(a);
                ul.appendChild(li);
            });
            fontesDiv.appendChild(ul);
            botContainer.appendChild(fontesDiv);
        }

    } catch (err) {
        typingDiv.remove();
        appendMessage('Ocorreu um erro ao buscar a resposta.', botContainer);
        console.error(err);
    } finally {
        sendButton.disabled = false;
        perguntaInput.focus();
        chatBody.scrollTop = chatBody.scrollHeight;
    }
}
</script>

</body>
</html>
